name: Reminders
on:
  schedule:
    - cron: '7 * * * *' # hourly; GitHub may start it a few minutes late
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - run: node scripts/remind.mjs
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
