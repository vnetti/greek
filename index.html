<body><main id="app">
  <!-- splash: plain HTML+CSS so it shows before the Firebase SDK has loaded -->
  <div class="splash">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, collection, doc, getDoc, getDocs, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

// Public web config, not a secret: access is enforced by Firestore rules (users/{uid}/** is owner-only).
const fb = initializeApp({
  apiKey: 'AIzaSyBM-nKxH-5GoYd5lUyDxwhDLOlh0Ea532A',
  authDomain: 'gen-lang-client-0926920334.firebaseapp.com',
  projectId: 'gen-lang-client-0926920334',
  appId: '1:665443389022:web:1b6839b28521d9cefeeecf'
});
const auth = getAuth(fb);
const fs = initializeFirestore(fb, { localCache: persistentLocalCache(), ignoreUndefinedProperties: true });

// A translation card needs no reasoning: lite with minimal thinking is fastest. Some versions reject 'minimal' (400),
// which just moves on to lite with defaults, then full Flash with 'low' (supported by every Gemini 3 Flash).
const TRIES = [['gemini-flash-lite-latest', { thinkingLevel: 'minimal' }], ['gemini-flash-lite-latest'], ['gemini-flash-latest', { thinkingLevel: 'low' }]];
const INTERVALS = [1, 3, 7, 14, 30, 60]; // days, indexed by box
const DIRS = ['gr2ru', 'ru2gr', 'listen'];
const NEW_PER_DAY = 10;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);

// --- storage: Firestore users/{uid}/cards, cached on device so review works offline.
// Writes are not awaited: they land in the local cache at once and sync when online.
const cardsRef = () => collection(fs, 'users', auth.currentUser.uid, 'cards');
// cards made before listening mode get its schedule in memory, a day after the reverse one; stored on first grade
const loadAll = async () => (await getDocs(cardsRef())).docs.map(d => d.data())
  .map(c => ({ ...c, listen: c.listen ?? { box: 0, due: c.ru2gr.due + 1 } }));
const save = c => setDoc(doc(cardsRef(), c.id), c).catch(e => alert('Не сохранилось: ' + e.message));
const remove = id => deleteDoc(doc(cardsRef(), id));
navigator.storage?.persist?.();
let cards = [], q = [];

// One-time move of cards from the pre-Firebase on-device IndexedDB; the old copy is kept untouched.
function oldCards() {
  return new Promise(res => {
    const r = indexedDB.open('greek');
    r.onupgradeneeded = () => r.transaction.abort(); // no old db: don't create one
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('cards')) return res([]);
      const g = db.transaction('cards').objectStore('cards').getAll();
      g.onsuccess = () => res(g.result);
      g.onerror = () => res([]);
    };
  });
}
async function migrate() {
  if (localStorage.getItem('migrated')) return;
  const old = await oldCards();
  old.forEach(save);
  localStorage.setItem('migrated', '1');
  return old.length;
}

// API keys live in one shared doc: readable by the email allowlist in Firestore rules, writable by the owner only.
// Others get a permission error here and simply type their own keys. Mirrored to localStorage for sync access.
const keysRef = () => doc(fs, 'shared', 'keys');
const saveKeys = () => setDoc(keysRef(), { key: localStorage.getItem('key'), tts: localStorage.getItem('tts') }).catch(() => {});
async function loadKeys() {
  const k = (await getDoc(keysRef()).catch(() => null))?.data();
  if (!k) return saveKeys(); // first device: upload whatever is already entered here
  for (const n of ['key', 'tts']) if (k[n] != null) localStorage.setItem(n, k[n]);
}

// optional keys remember an empty answer, so we don't ask on every word
function key(name = 'key', label = 'Gemini API key (aistudio.google.com/apikey)', optional = false) {
  if (localStorage.getItem(name) === null) {
    const k = prompt(label)?.trim();
    if (k || optional) { localStorage.setItem(name, k || ''); saveKeys(); }
  }
  return localStorage.getItem(name);
}
const ttsKey = () => key('tts', 'Google Text-to-Speech API key (пусто — будет голос iOS)', true);
// Prefilled with current keys; Cancel changes nothing, an empty Gemini field keeps the old key.
function editKeys() {
  const g = prompt('Gemini API key', localStorage.getItem('key') || '');
  if (g === null) return;
  const t = prompt('Google Text-to-Speech API key (пусто — голос iOS)', localStorage.getItem('tts') || '');
  if (t === null) return;
  if (g.trim()) localStorage.setItem('key', g.trim());
  localStorage.setItem('tts', t.trim());
  saveKeys();
  home('Ключи сохранены');
}

// --- Google APIs ---
const PROMPT = `Ты делаешь карточки для русскоговорящего, который учит новогреческий.
На входе слово или фраза на русском или греческом. Верни JSON:
gr — греческий вариант (существительные с артиклем ο/η/το, глаголы в 1 л. ед. ч. настоящего времени, фразы как есть);
ru — короткий русский перевод (1–3 варианта через запятую);
tr — произношение gr русскими буквами, слоги через дефис, ударный слог ЗАГЛАВНЫМИ (пример: и ка-ли-МЭ-ра);
ex — короткий простой пример на греческом с этим словом;
exRu — перевод примера;
forms — краткая грамматика: у существительного мн. число с артиклем («мн.: οι θάλασσες»), у глагола аорист и будущее
(«аор.: έφαγα · буд.: θα φάω»), у прилагательного м/ж/ср («καλός, καλή, καλό»); для остального пустая строка;
emoji — один эмодзи, лучше всего передающий смысл.
Вход: `;
async function google(url, body, k = key()) {
  if (!k) throw Object.assign(new Error('нет ключа'), { status: 401 });
  const r = await fetch(url + '?key=' + encodeURIComponent(k), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    signal: AbortSignal.timeout(12000)
  });
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error?.message || r.status), { status: r.status });
  return j;
}
// Errors without .status are network trouble (offline, timeout): callers park the word until we're online.
async function ask(text) {
  const S = { type: 'STRING' }, fields = ['gr', 'ru', 'tr', 'ex', 'exRu', 'forms', 'emoji'];
  const config = {
    responseMimeType: 'application/json',
    responseSchema: { type: 'OBJECT', properties: Object.fromEntries(fields.map(f => [f, S])), required: fields }
  };
  for (const [i, [model, thinkingConfig]] of TRIES.entries()) {
    try {
      const t0 = performance.now();
      const j = await google(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        { contents: [{ parts: [{ text: PROMPT + text }] }], generationConfig: { ...config, thinkingConfig } });
      ask.took = `Gemini ${sec(t0)} (${model.replace('gemini-', '').replace('-latest', '')}${i ? ', попытка ' + (i + 1) : ''})`;
      return JSON.parse(j.candidates[0].content.parts[0].text);
    } catch (e) {
      // overload/bad param → next model; a slow first model gets one chance on lite; real offline fails fast to the queue
      const retryable = e.status ? [400, 429, 500, 503].includes(e.status) : e.name === 'TimeoutError' && i === 0;
      if (i === TRIES.length - 1 || !retryable) throw e;
      await new Promise(r => setTimeout(r, 800 * i));
    }
  }
}
const tts = async text => (await google('https://texttospeech.googleapis.com/v1/text:synthesize', {
  input: { text }, voice: { languageCode: 'el-GR' }, audioConfig: { audioEncoding: 'MP3' }
}, ttsKey())).audioContent;
function play(audio, text) {
  if (audio) return new Audio('data:audio/mpeg;base64,' + audio).play().catch(() => {});
  const u = new SpeechSynthesisUtterance(text); // fallback: iOS voice
  u.lang = 'el-GR';
  speechSynthesis.speak(u);
}
const say = c => play(c.audio, c.gr);
// Greek words only from the grammar line: "аор.: έφαγα · буд.: θα φάω" → "έφαγα, θα φάω"
const formsText = c => c.forms?.match(/[\p{Script=Greek}\p{M}]+(?:\s+[\p{Script=Greek}\p{M}]+)*/gu)?.join(', ') || '';
function sayPart(c, k, text) {
  play(c[k], text);
  // older cards lack this recording: speak with iOS now, fetch Google audio for next time
  if (!c[k] && text) tts(text).then(a => { c[k] = a; save(c); }).catch(() => {});
}

// Full card content from a word: Gemini text, then both recordings in parallel.
async function build(text, step = () => {}) {
  step('Перевожу…');
  const c = await ask(text);
  step('Записываю произношение…');
  const t0 = performance.now();
  const [a, ea, fa] = await Promise.allSettled([tts(c.gr), tts(c.ex), formsText(c) && tts(formsText(c))]);
  c.audio = a.value; c.exAudio = ea.value; c.formsAudio = fa.value || undefined; // undefined: iOS voice plays instead
  const timing = `${ask.took} · озвучка ${sec(t0)}`; // shown under the preview to see where time goes
  return { c, note: a.reason ? `Озвучка голосом iOS (Cloud TTS: ${a.reason.message}) · ${timing}` : timing };
}
const sec = t0 => ((performance.now() - t0) / 1000).toFixed(1) + ' с';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2); // time-ordered prefix
const schedule = () => ({ gr2ru: { box: 0, due: today() }, ru2gr: { box: 0, due: today() + 1 }, listen: { box: 0, due: today() + 2 } });
const draft = text => ({ id: newId(), text, pending: true, ...schedule() });

// Words added without network (or several at once) wait here as drafts and get filled in the background.
let busy = false;
async function processPending() {
  if (busy || !navigator.onLine) return;
  busy = true;
  for (const c of cards.filter(c => c.pending)) {
    try { Object.assign(c, (await build(c.text)).c, { pending: false }); save(c); }
    catch (e) { if (!e.status) break; } // offline again: stop, the 'online' event retries
  }
  busy = false;
  if ($('.hero') && !$('#w').value) home(); // refresh counters unless the user is typing
}
addEventListener('online', processPending);

// --- logic ---
const base = s => s.toLowerCase().normalize('NFC').replace(/ς/g, 'σ').replace(/[.,!?;·«»"]/g, '')
  .trim().replace(/\s+/g, ' ').replace(/^(ο|η|το|οι|τα|ο\/η)\s+/, '');
const loose = s => base(s).normalize('NFD').replace(/\p{M}/gu, '');
const check = (answer, gr) => base(answer) === base(gr) ? 'ok' : loose(answer) === loose(gr) ? 'accent' : 'bad';
function grade(d, ok) {
  if (ok) { d.due = today() + INTERVALS[Math.min(d.box, INTERVALS.length - 1)]; d.box++; }
  else { d.box = 0; d.due = today() + 1; }
}
// A card is new until first graded (then `introduced` = that day). At most NEW_PER_DAY new cards enter per day, oldest first.
const isNew = c => !c.pending && c.introduced == null && DIRS.every(d => c[d].box === 0);
const newRoom = () => Math.max(0, NEW_PER_DAY - cards.filter(c => c.introduced === today()).length);
const newWaiting = () => Math.max(0, cards.filter(isNew).length - newRoom());
function queue() {
  const fresh = new Set(cards.filter(isNew).sort((a, b) => a.id < b.id ? -1 : 1).slice(0, newRoom()));
  const a = cards.filter(c => !c.pending && (!isNew(c) || fresh.has(c)))
    .flatMap(c => DIRS.filter(d => c[d].due <= today()).map(dir => ({ c, dir })));
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// --- screens ---
let total = 0; // cards in the current review session, for the progress bar
const plural = (n, one, few, many) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? one
  : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
const spinner = text => `<div class="spin"></div><p class="mut center">${text}</p>`;
function home(msg = '') {
  const due = queue().length, waiting = newWaiting(), pend = cards.filter(c => c.pending).length;
  app.innerHTML = `
    <h1>Λέξεις</h1>
    <div class="sub">${plural(cards.length, 'слово', 'слова', 'слов')} в словаре ›</div>
    <div class="hero">
      <div class="label">На сегодня</div>
      <div class="n">${due}</div>
      ${waiting ? `<div class="later">ещё ${plural(waiting, 'новое слово ждёт', 'новых слова ждут', 'новых слов ждут')} следующих дней</div>` : ''}
      <button id="rev" ${due ? '' : 'disabled'}>${due ? 'Начать повторение' : 'Всё повторено ✓'}</button>
    </div>
    <form id="add" class="add"><textarea id="w" rows="1" placeholder="Новое слово или список" autocomplete="off"></textarea>
      <button aria-label="Добавить">+</button></form>
    <div class="msg">${esc(msg)}${pend ? `<div>⏳ Ждут интернета: ${pend} — доделаю сам</div>` : ''}</div>
    <div class="links"><a href="#" id="lst">Словарь</a><a href="#" id="exp">Экспорт</a><a href="#" id="imp">Импорт</a><a href="#" id="k">Ключи</a></div>
    <div class="account">${esc(auth.currentUser?.email)} · <a href="#" id="out">Выйти</a></div>
    <input type="file" id="file" accept=".json,application/json" hidden>`;
  $('#rev').onclick = () => { q = queue(); total = q.length; next(); };
  $('#add').onsubmit = e => { e.preventDefault(); const w = $('#w').value.trim(); if (w && key()) add(w); };
  $('#w').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#add').requestSubmit(); } };
  $('#w').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; };
  $('#lst').onclick = $('.sub').onclick = e => { e.preventDefault(); list(); };
  $('#exp').onclick = e => { e.preventDefault(); exportAll(); };
  $('#imp').onclick = e => { e.preventDefault(); $('#file').click(); };
  $('#file').onchange = e => e.target.files[0] && importAll(e.target.files[0]);
  $('#k').onclick = e => { e.preventDefault(); editKeys(); };
  $('#out').onclick = e => {
    e.preventDefault();
    if (!confirm('Выйти из аккаунта?')) return;
    // keys came from this account: don't leave them for whoever signs in next
    localStorage.removeItem('key'); localStorage.removeItem('tts');
    cards = [];
    signOut(auth); // onAuthStateChanged then shows the login screen
  };
}

const sayBtn = (id = 'say', cls = '') => `<button type="button" class="say ${cls}" id="${id}" aria-label="Произнести"><svg width="20" height="20"
  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>`;
const SAY = sayBtn();
const cardHtml = (c, verdict = '') => `<div class="card">${verdict}
  <div class="emoji">${esc(c.emoji)}</div>
  <div class="word">${esc(c.gr)}${SAY}</div>
  <div class="tr">${esc(c.tr)}</div>
  ${c.forms ? `<div class="forms">${esc(c.forms)}${formsText(c) ? sayBtn('sayForms', 'sm') : ''}</div>` : ''}
  <div class="ru">${esc(c.ru)}</div>
  ${c.ex ? `<div class="ex">${sayBtn('sayEx', 'sm')}${esc(c.ex)}<div>${esc(c.exRu)}</div></div>` : ''}</div>`;
const wire = c => {
  if ($('#say')) $('#say').onclick = () => say(c);
  if ($('#sayEx')) $('#sayEx').onclick = () => sayPart(c, 'exAudio', c.ex);
  if ($('#sayForms')) $('#sayForms').onclick = () => sayPart(c, 'formsAudio', formsText(c));
};

// learning level = weakest direction, as filled dots out of INTERVALS.length
const level = c => {
  if (c.pending) return '⏳';
  const b = Math.min(...DIRS.map(d => c[d].box), INTERVALS.length);
  return '●'.repeat(b) + '○'.repeat(INTERVALS.length - b);
};

function list() {
  const sortKey = c => (c.gr || c.text).replace(/^(ο|η|το|οι|τα)\s+/, '');
  const rows = [...cards].sort((a, b) => sortKey(a).localeCompare(sortKey(b), "el"));
  app.innerHTML = `<div class="top"><button class="x" id="x" aria-label="Назад">✕</button><h2>Словарь</h2>
      <span class="mut small">${cards.length}</span></div>
    <input id="s" class="search" placeholder="Поиск по-гречески или по-русски" autocomplete="off">
    <div class="list">${rows.map(c => `<button class="item" data-id="${esc(c.id)}" data-q="${esc((c.gr || c.text) + ' ' + (c.ru || '')).toLowerCase()}">
      <span class="e">${esc(c.pending ? '⏳' : c.emoji)}</span>
      <span class="t"><b>${esc(c.gr || c.text)}</b><small>${esc(c.pending ? 'ждёт интернета' : c.ru)}</small></span>
      <span class="lvl">${level(c)}</span></button>`).join('') || '<p class="mut center">Пока пусто</p>'}</div>`;
  $('#x').onclick = () => home();
  $('#s').oninput = e => { // filter in place so the keyboard stays open
    const f = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.item').forEach(el => el.hidden = !el.dataset.q.includes(f));
  };
  document.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const c = cards.find(c => c.id === el.dataset.id);
    if (!c.pending) return view(c);
    if (!confirm(`«${c.text}» ещё не готово. Убрать из очереди?`)) return;
    cards = cards.filter(x => x !== c);
    remove(c.id);
    list();
  });
}

// Read-only card from the dictionary, with when each direction comes up next; editing is one tap away.
function view(c) {
  const L = { gr2ru: 'Греческий → русский', ru2gr: 'Русский → греческий', listen: 'На слух' };
  const when = d => { const n = c[d].due - today(); return n <= 0 ? 'сегодня' : n === 1 ? 'завтра' : 'через ' + plural(n, 'день', 'дня', 'дней'); };
  app.innerHTML = `<div class="top"><button class="x" id="x" aria-label="Назад">←</button><h2>Карточка</h2>
      <button class="sec edit-btn" id="ed">Изменить</button></div>` + cardHtml(c) +
    `<div class="card sched">${DIRS.map(d => `<div><span>${L[d]}</span><b>${when(d)}</b></div>`).join('')}</div>`;
  wire(c);
  $('#x').onclick = () => list();
  $('#ed').onclick = () => edit(c);
}

function edit(c) {
  const F = [['gr', 'Греческий'], ['tr', 'Транскрипция'], ['forms', 'Грамматика'], ['ru', 'Перевод'], ['ex', 'Пример'],
    ['exRu', 'Перевод примера'], ['emoji', 'Эмодзи']];
  app.innerHTML = `<div class="top"><button class="x" id="x" aria-label="Назад">←</button><h2>Редактирование</h2>${SAY}</div>
    <form id="ef" class="card form">${F.map(([k, l]) => `<label>${l}<input name="${k}" value="${esc(c[k])}" autocomplete="off"></label>`).join('')}
      <button id="sv">Сохранить</button></form>
    <button class="bad" id="del">Удалить карточку</button>`;
  $('#x').onclick = () => view(c);
  $('#say').onclick = () => say(c);
  $('#ef').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target)), newGr = d.gr.trim() !== c.gr, newEx = d.ex !== c.ex;
    if (!d.gr.trim()) return alert('Греческое слово не может быть пустым');
    if (d.forms !== c.forms) delete c.formsAudio; // re-recorded on next play
    Object.assign(c, d, { gr: d.gr.trim() });
    if (newGr || newEx) { // old audio says the old text
      $('#sv').disabled = true; $('#sv').textContent = 'Озвучиваю…';
      if (newGr) try { c.audio = await tts(c.gr); } catch { delete c.audio; }
      if (newEx) try { c.exAudio = await tts(c.ex); } catch { delete c.exAudio; }
    }
    save(c);
    view(c);
  };
  $('#del').onclick = () => {
    if (!confirm(`Удалить «${c.gr}»?`)) return;
    cards = cards.filter(x => x !== c);
    remove(c.id);
    list();
  };
}

// same flip card as the splash: what you typed on the front, "?" on the back, live step text below
const making = text => `<div class="splash"><div class="flip">
    <div class="face${text.length > 9 ? ' long' : ''}">${esc(text)}</div><div class="face back q">?</div></div>
  <div class="splash-title">Готовлю карточку</div><div class="mut small" id="step"></div></div>`;

async function add(raw) {
  const words = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const park = list => list.forEach(w => { const d = draft(w); cards.push(d); save(d); });
  if (words.length > 1) { // batch: no preview, fill in the background
    park(words);
    home(`Готовлю ${plural(words.length, 'карточку', 'карточки', 'карточек')}…`);
    return processPending();
  }
  const text = words[0];
  app.innerHTML = making(text);
  try {
    const { c, note } = await build(text, s => { if ($('#step')) $('#step').textContent = s; });
    app.innerHTML = cardHtml(c) + `<p class="mut small center">${esc(note)}</p>
      <div class="row"><button class="sec" id="no">Отмена</button><button id="yes">Сохранить</button></div>`;
    wire(c);
    say(c);
    $('#no').onclick = () => home();
    $('#yes').onclick = () => {
      Object.assign(c, { id: newId(), ...schedule() });
      save(c);
      cards.push(c);
      home('Добавлено: ' + c.gr);
    };
  } catch (e) {
    if (e.status) return home('Ошибка: ' + e.message);
    park([text]); // no network: keep the word, finish it later
    home(`Нет связи — «${text}» доделаю сам, когда появится интернет`);
  }
}

function next() {
  const it = q.shift();
  if (!it) return home('Готово на сегодня 🎉');
  const { c, dir } = it;
  const answer = `<form id="f"><input id="a" lang="el" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    placeholder="Ελληνικά…"><button style="margin-top:12px">Проверить</button></form>`;
  if (dir === 'gr2ru') {
    app.innerHTML = topBar() + `<div class="card front"><div class="chip">Что это значит?</div>
      <div class="word">${esc(c.gr)}${SAY}</div></div>
      <button id="show">Показать ответ</button>`;
    $('#show').onclick = () => back(it, null);
  } else if (dir === 'ru2gr') {
    app.innerHTML = topBar() + `<div class="card front"><div class="chip">Как по-гречески?</div>
      <div class="emoji">${esc(c.emoji)}</div><div class="word">${esc(c.ru)}</div></div>` + answer;
  } else { // listen: audio only, type what you hear
    app.innerHTML = topBar() + `<div class="card front"><div class="chip">Что ты слышишь?</div>${sayBtn('say', 'big')}
      <div class="mut small" style="margin-top:14px">нажми, чтобы послушать ещё раз</div></div>` + answer;
  }
  wire(c);
  if (dir !== 'ru2gr') say(c);
  if ($('#f')) { $('#a').focus(); $('#f').onsubmit = e => { e.preventDefault(); back(it, $('#a').value); }; }
  $('#x').onclick = () => home();
}
// progress counts the card on screen as not yet done; called after q.shift()
const topBar = () => `<div class="top"><button class="x" id="x" aria-label="Выйти">✕</button>
  <div class="bar"><i style="width:${(total - q.length - 1) / total * 100}%"></i></div>
  <span class="mut small">${total - q.length}/${total}</span></div>`;

function back(it, answer) {
  const c = it.c;
  let verdict = '', buttons = '<button class="bad" id="n">Не знал</button><button class="ok" id="y">Знал</button>';
  if (answer !== null) {
    const r = check(answer, c.gr);
    verdict = r === 'ok' ? '<div class="verdict ok">Верно</div>'
      : r === 'accent' ? `<div class="verdict warn">Засчитано, проверь ударение: «${esc(answer)}»</div>`
      : `<div class="verdict bad">Ты написал: «${esc(answer)}»</div>`;
    buttons = r === 'bad' ? '<button class="sec" id="y">Засчитать</button><button class="bad" id="n">Дальше</button>'
      : '<button id="y">Дальше</button>';
    say(c);
  }
  app.innerHTML = topBar() + cardHtml(c, verdict) + `<div class="row">${buttons}</div>
    <p class="center"><a href="#" id="del">Удалить карточку</a></p>`;
  $('#x').onclick = () => home();
  wire(c);
  $('#y').onclick = () => done(it, true);
  if ($('#n')) $('#n').onclick = () => done(it, false);
  $('#del').onclick = e => {
    e.preventDefault();
    if (!confirm(`Удалить «${c.gr}»?`)) return;
    cards = cards.filter(x => x !== c);
    q = q.filter(x => x.c !== c);
    remove(c.id);
    next();
  };
}

function done(it, ok) {
  if (!it.retry) { // re-shows within a session don't move the schedule
    grade(it.c[it.dir], ok);
    it.c.introduced ??= today(); // counts toward today's NEW_PER_DAY
    save(it.c);
  }
  if (!ok) { q.push({ ...it, retry: true }); total++; }
  next();
}

async function exportAll() {
  const file = new File([JSON.stringify(cards)], `greek-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) return navigator.share({ files: [file] }).catch(() => {});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}
async function importAll(file) {
  try {
    const list = JSON.parse(await file.text());
    if (!Array.isArray(list) || !list.every(c => c.id && c.gr && c.gr2ru && c.ru2gr)) throw new Error('не тот файл');
    list.forEach(save);
    cards = await loadAll();
    home('Импортировано: ' + list.length);
  } catch (e) { home('Ошибка импорта: ' + e.message); }
}

function selftest() {
  const eq = (a, b) => { if (a !== b) throw new Error(a + ' !== ' + b); };
  eq(check('καλημέρα', 'η καλημέρα'), 'ok');
  eq(check(' Καλημερα ', 'η καλημέρα'), 'accent');
  eq(check('καλησπέρα', 'η καλημέρα'), 'bad');
  eq(check('ο δρόμοσ', 'ο δρόμος'), 'ok');
  const d = { box: 0, due: 0 };
  grade(d, true); eq(d.due, today() + 1);
  grade(d, true); eq(d.due, today() + 3);
  grade(d, false); eq(d.box, 0); eq(d.due, today() + 1);
  const real = cards; // new-per-day limit: 12 fresh cards, only gr2ru is due today
  cards = Array.from({ length: 12 }, (_, i) => ({ id: 'a' + String(i).padStart(2, '0'), ...schedule() }));
  eq(queue().length, NEW_PER_DAY); eq(newWaiting(), 2);
  cards[0].introduced = today(); // one seen today: still 10 today in total, one less waiting
  eq(queue().length, NEW_PER_DAY); eq(newWaiting(), 2); eq(newRoom(), NEW_PER_DAY - 1);
  cards.push(draft('x')); eq(queue().length, NEW_PER_DAY); // drafts never enter review
  cards = real;
  return 'selftest ok';
}

function login(msg = '') {
  app.innerHTML = `<div class="login"><h1>Λέξεις</h1><div class="mut">Греческие слова на каждый день</div>
    <button id="in">Войти через Google</button><p class="mut small">${esc(msg)}</p></div>`;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' }); // let a different account sign in after logout
  $('#in').onclick = () => signInWithPopup(auth, provider).catch(e => login('Ошибка входа: ' + e.message));
}

navigator.serviceWorker?.register('sw.js').catch(() => {});
const SPLASH = app.innerHTML; // reused while a fresh sign-in loads the dictionary
onAuthStateChanged(auth, async user => {
  if (!user) return login();
  app.innerHTML = SPLASH;
  try {
    await loadKeys();
    const moved = await migrate();
    cards = await loadAll();
    processPending(); // background: finish words added offline
    home(location.hash === '#test' ? selftest() : moved ? `Перенесено с телефона в аккаунт: ${moved}` : '');
  } catch (e) { home('Ошибка загрузки: ' + e.message); }
});
</script>
