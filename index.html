/* ---------- tokens: four themes, each light + dark (night is always dark) ---------- */

}

[data-theme=aegean]{--ground:#D9E5F2;--block:#FFFFFF;--ink:#0E2A47;--mut:#4A6180;--rule:#DCE5EF;--inset:#EEF3F9;--primary:#0E4C92;--on-primary:#FFFFFF;--head:#0E4C92;--head-ink:#FFFFFF;--head-mut:#C6D8EE}

    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28)}
  [data-theme=graphite]{--ground:#0E1013;--block:#191C21;--ink:#ECEEF1;--mut:#9BA1AB;--rule:#2A2E35;--inset:#22262C;--primary:#ECEEF1;--on-primary:#0E1013}

}

/* ---------- base: three sizes (13 / 17 / 34) ranked by weight; the count numeral is the one exception ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 17px/1.45 var(--font);caret-color:var(--primary);
  padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));min-height:100dvh;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--primary) 22%,transparent)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
main{max-width:440px;margin:0 auto}
h1{font:800 34px/1.1 var(--font);letter-spacing:-.02em;margin:0}
h2{font:800 17px/1.2 var(--font);margin:0;flex:1}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .small{font-size:13px} .center{text-align:center}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
button{font:700 17px/1 var(--font);border:0;border-radius:14px;padding:16px 18px;background:var(--primary);color:var(--on-primary);

button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
button.sec{background:var(--inset);color:var(--ink)}
button.ok{background:var(--ok-bg);color:var(--ok)} button.bad{background:var(--bad-bg);color:var(--bad)}
button.link{background:none;color:var(--primary);width:auto;padding:8px 4px;font-size:17px}
button.icon{width:40px;height:40px;padding:0;border-radius:12px;background:var(--block);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
button.say{width:44px;height:44px;padding:0;border-radius:50%;background:var(--inset);color:var(--ink);display:inline-grid;place-items:center;vertical-align:middle;margin-left:10px}
input,textarea{font:inherit;color:var(--ink);caret-color:var(--primary)}
input{width:100%;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--block);outline:none}

.add button{width:44px;height:44px;padding:0;border-radius:12px;flex:none;display:grid;place-items:center}
.msg{margin:6px 6px 0;font-size:13px;color:var(--mut);min-height:18px}

.menu{padding:0 16px;margin-top:12px}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;color:var(--ink);border-radius:0;padding:14px 0;font-weight:500;text-align:left;

.mi:last-child{border-bottom:0}

.acct{display:flex;align-items:center;gap:12px;padding:14px 0}

/* ---------- screens with a top bar ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-height:44px}

/* ---------- card: one scale, one axis everywhere ---------- */
.card{position:relative;text-align:center;padding:28px 20px;animation:rise .35s cubic-bezier(.16,1,.3,1)}

.tr{color:var(--mut);margin-top:6px}
.forms{font-size:13px;font-weight:700;color:var(--mut);margin-top:8px;display:flex;justify-content:center;align-items:center;gap:6px}
.ru{font-weight:700;margin-top:18px;padding-top:18px;border-top:1px solid var(--rule)}
.ex{margin-top:18px;text-align:left;background:var(--inset);border-radius:14px;padding:12px 14px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.ex .t{flex:1} .ex small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:2px}
button.say.sm{width:34px;height:34px;margin:0;background:var(--block)} button.say.sm svg.i{width:16px;height:16px}
.forms button.say.sm{width:28px;height:28px;background:var(--inset)} .forms button.say.sm svg.i{width:14px;height:14px}
button.say.big{width:104px;height:104px;margin:0;background:var(--inset)} button.say.big svg.i{width:44px;height:44px}
.card.stamped{padding-top:56px}
.yours{font-size:13px;color:var(--mut);margin-bottom:12px}
/* verdict stamps onto the card and stays, like a validated ticket */
.stamp{position:absolute;top:16px;right:14px;font:800 13px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;
  padding:7px 10px;border:2px solid currentColor;border-radius:8px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.16,1,.3,1)}

.item{display:flex;align-items:center;gap:12px;background:none;color:var(--ink);border-radius:0;padding:12px;text-align:left;font-weight:400;border-bottom:1px solid var(--rule)}

.splash{min-height:85dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:900px;text-align:center}

/* ---------- help: «Как это работает» ---------- */

@media (prefers-reduced-motion:reduce){.flip,.card,.stamp{animation:none}.top .track .train,.top .fill{transition:none}}
</style>

const auth = getAuth(fb);
const fs = initializeFirestore(fb, { localCache: persistentLocalCache(), ignoreUndefinedProperties: true });

// A translation card needs no reasoning: lite with minimal thinking is fastest. Some versions reject 'minimal' (400),
// which just moves on to lite with defaults, then full Flash with 'low' (supported by every Gemini 3 Flash).

const $ = s => document.querySelector(s);

const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);

const cardsRef = () => collection(fs, 'users', auth.currentUser.uid, 'cards');
// cards made before listening mode get its schedule in memory, a day after the reverse one; stored on first grade

const metaRef = n => doc(fs, 'users', auth.currentUser.uid, 'meta', n);
let stats = {}, push = {};
async function loadMeta() {
  [stats, push] = await Promise.all(['stats', 'push'].map(n => getDoc(metaRef(n)).then(d => d.data() ?? {}).catch(() => ({}))));
  if (push.token && globalThis.Notification?.permission === 'granted') pushToken().then(t => { // tokens rotate: keep ours current
    if (t !== push.token) { push.token = t; setDoc(metaRef('push'), push); }
  }).catch(() => {});
}
// a day counts once at least one card was graded; the streak survives until the end of the next day
function nextStats(s, t) {
  if (s.last === t) return s;
  const streak = s.last === t - 1 ? s.streak + 1 : 1;
  return { last: t, streak, best: Math.max(s.best ?? 0, streak) };
}
function bumpStreak() {
  const n = nextStats(stats, today());
  if (n !== stats) { stats = n; setDoc(metaRef('stats'), stats).catch(() => {}); }
}
const streakNow = () => stats.last >= today() - 1 ? stats.streak : 0;
const pushToken = async () => getToken(getMessaging(fb), { vapidKey: VAPID, serviceWorkerRegistration: await navigator.serviceWorker.ready });

async function setupReminders() {
  // iOS exposes web push only to the app opened from the home screen (iOS 16.4+)
  if (!('Notification' in window) || !('PushManager' in window)) return home('Напоминания работают в приложении с экрана «Домой» (iOS 16.4+)');
  const h = prompt('Во сколько напоминать? Час от 0 до 23. Пусто — выключить', String(push.hour ?? 9));
  if (h === null) return;
  if (!h.trim()) { push = {}; setDoc(metaRef('push'), push); return home('Напоминания выключены'); }
  const hour = Math.min(23, Math.max(0, parseInt(h, 10) || 0));
  if (await Notification.requestPermission() !== 'granted') return home('Уведомления запрещены — разреши их в настройках iOS для Λέξεις');
  try {
    if (!(await isSupported())) throw new Error('браузер не поддерживает push');
    push = { token: await pushToken(), hour, tz: new Date().getTimezoneOffset() };
    await setDoc(metaRef('push'), push);
    home(`Напомним в ${hour}:00, если к этому времени ещё не повторишь`);
  } catch (e) { home('Не получилось включить напоминания: ' + e.message); }
}

// One-time move of cards from the pre-Firebase on-device IndexedDB; the old copy is kept untouched.
function oldCards() {
  return new Promise(res => {
    const r = indexedDB.open('greek');
    r.onupgradeneeded = () => r.transaction.abort(); // no old db: don't create one
    r.onerror = () => res([]);
    r.onsuccess = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('cards')) return res([]);
      const g = db.transaction('cards').objectStore('cards').getAll();
      g.onsuccess = () => res(g.result);
      g.onerror = () => res([]);
    };
  });
}
async function migrate() {
  if (localStorage.getItem('migrated')) return;
  const old = await oldCards();
  old.forEach(save);
  localStorage.setItem('migrated', '1');
  return old.length;
}

// API keys live in one shared doc: readable by the email allowlist in Firestore rules, writable by the owner only.
// Others get a permission error here and simply type their own keys. Mirrored to localStorage for sync access.
const keysRef = () => doc(fs, 'shared', 'keys');
const saveKeys = () => setDoc(keysRef(), { key: localStorage.getItem('key'), tts: localStorage.getItem('tts') }).catch(() => {});
async function loadKeys() {
  const k = (await getDoc(keysRef()).catch(() => null))?.data();
  if (!k) return saveKeys(); // first device: upload whatever is already entered here
  for (const n of ['key', 'tts']) if (k[n] != null) localStorage.setItem(n, k[n]);
}

// optional keys remember an empty answer, so we don't ask on every word
function key(name = 'key', label = 'Gemini API key (aistudio.google.com/apikey)', optional = false) {
  if (localStorage.getItem(name) === null) {
    const k = prompt(label)?.trim();
    if (k || optional) { localStorage.setItem(name, k || ''); saveKeys(); }
  }
  return localStorage.getItem(name);
}
const ttsKey = () => key('tts', 'Google Text-to-Speech API key (пусто — будет голос iOS)', true);
// Prefilled with current keys; Cancel changes nothing, an empty Gemini field keeps the old key.
function editKeys() {
  const g = prompt('Gemini API key', localStorage.getItem('key') || '');
  if (g === null) return;
  const t = prompt('Google Text-to-Speech API key (пусто — голос iOS)', localStorage.getItem('tts') || '');
  if (t === null) return;
  if (g.trim()) localStorage.setItem('key', g.trim());
  localStorage.setItem('tts', t.trim());
  saveKeys();
  home('Ключи сохранены');
}

// --- Google APIs ---
const PROMPT = `Ты делаешь карточки для русскоговорящего, который учит новогреческий.
На входе слово или фраза на русском или греческом. Верни JSON:
gr — греческий вариант (существительные с артиклем ο/η/το, глаголы в 1 л. ед. ч. настоящего времени, фразы как есть);
ru — короткий русский перевод (1–3 варианта через запятую);
tr — произношение gr русскими буквами, слоги через дефис, ударный слог ЗАГЛАВНЫМИ (пример: и ка-ли-МЭ-ра);
ex — короткий простой пример на греческом с этим словом;
exRu — перевод примера;
forms — краткая грамматика: у существительного мн. число с артиклем («мн.: οι θάλασσες»), у глагола аорист и будущее
(«аор.: έφαγα · буд.: θα φάω»), у прилагательного м/ж/ср («καλός, καλή, καλό»); для остального пустая строка;
emoji — один эмодзи, лучше всего передающий смысл.
Вход: `;
async function google(url, body, k = key()) {
  if (!k) throw Object.assign(new Error('нет ключа'), { status: 401 });
  const r = await fetch(url + '?key=' + encodeURIComponent(k), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    signal: AbortSignal.timeout(12000)
  });
  const j = await r.json();
  if (!r.ok) throw Object.assign(new Error(j.error?.message || r.status), { status: r.status });
  return j;
}
// Errors without .status are network trouble (offline, timeout): callers park the word until we're online.
async function ask(text) {
  const S = { type: 'STRING' }, fields = ['gr', 'ru', 'tr', 'ex', 'exRu', 'forms', 'emoji'];
  const config = {
    responseMimeType: 'application/json',
    responseSchema: { type: 'OBJECT', properties: Object.fromEntries(fields.map(f => [f, S])), required: fields }
  };
  for (const [i, [model, thinkingConfig]] of TRIES.entries()) {
    try {
      const t0 = performance.now();
      const j = await google(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,
        { contents: [{ parts: [{ text: PROMPT + text }] }], generationConfig: { ...config, thinkingConfig } });
      ask.took = `Gemini ${sec(t0)} (${model.replace('gemini-', '').replace('-latest', '')}${i ? ', попытка ' + (i + 1) : ''})`;
      return JSON.parse(j.candidates[0].content.parts[0].text);
    } catch (e) {
      // overload/bad param → next model; a slow first model gets one chance on lite; real offline fails fast to the queue
      const retryable = e.status ? [400, 429, 500, 503].includes(e.status) : e.name === 'TimeoutError' && i === 0;
      if (i === TRIES.length - 1 || !retryable) throw e;
      await new Promise(r => setTimeout(r, 800 * i));
    }
  }
}
const tts = async text => (await google('https://texttospeech.googleapis.com/v1/text:synthesize', {
  input: { text }, voice: { languageCode: 'el-GR' }, audioConfig: { audioEncoding: 'MP3' }
}, ttsKey())).audioContent;
function play(audio, text) {
  if (audio) return new Audio('data:audio/mpeg;base64,' + audio).play().catch(() => {});
  const u = new SpeechSynthesisUtterance(text); // fallback: iOS voice
  u.lang = 'el-GR';
  speechSynthesis.speak(u);
}
const say = c => play(c.audio, c.gr);
// Greek words only from the grammar line: "аор.: έφαγα · буд.: θα φάω" → "έφαγα, θα φάω"
const formsText = c => c.forms?.match(/[\p{Script=Greek}\p{M}]+(?:\s+[\p{Script=Greek}\p{M}]+)*/gu)?.join(', ') || '';
function sayPart(c, k, text) {
  play(c[k], text);
  // older cards lack this recording: speak with iOS now, fetch Google audio for next time
  if (!c[k] && text) tts(text).then(a => { c[k] = a; save(c); }).catch(() => {});
}

// Full card content from a word: Gemini text, then both recordings in parallel.
async function build(text, step = () => {}) {
  step('Переводим…');
  const c = await ask(text);
  step('Записываем произношение…');
  const t0 = performance.now();
  const [a, ea, fa] = await Promise.allSettled([tts(c.gr), tts(c.ex), formsText(c) && tts(formsText(c))]);
  c.audio = a.value; c.exAudio = ea.value; c.formsAudio = fa.value || undefined; // undefined: iOS voice plays instead
  const timing = `${ask.took} · озвучка ${sec(t0)}`; // shown under the preview to see where time goes
  return { c, note: a.reason ? `Озвучка голосом iOS (Cloud TTS: ${a.reason.message}) · ${timing}` : timing };
}
const sec = t0 => ((performance.now() - t0) / 1000).toFixed(1) + ' с';
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2); // time-ordered prefix
const schedule = () => ({ gr2ru: { box: 0, due: today() }, ru2gr: { box: 0, due: today() + 1 }, listen: { box: 0, due: today() + 2 } });
const draft = text => ({ id: newId(), text, pending: true, ...schedule() });

// Words added without network (or several at once) wait here as drafts and get filled in the background.
let busy = false;
async function processPending() {
  if (busy || !navigator.onLine) return;
  busy = true;
  for (const c of cards.filter(c => c.pending)) {
    try { Object.assign(c, (await build(c.text)).c, { pending: false }); save(c); }
    catch (e) { if (!e.status) break; } // offline again: stop, the 'online' event retries
  }
  busy = false;
  if ($('.today') && !$('#w').value) home(); // refresh counters unless the user is typing
}
addEventListener('online', processPending);

// --- logic ---
const base = s => s.toLowerCase().normalize('NFC').replace(/ς/g, 'σ').replace(/[.,!?;·«»"]/g, '')
  .trim().replace(/\s+/g, ' ').replace(/^(ο|η|το|οι|τα|ο\/η)\s+/, '');
const loose = s => base(s).normalize('NFD').replace(/\p{M}/gu, '');
const check = (answer, gr) => base(answer) === base(gr) ? 'ok' : loose(answer) === loose(gr) ? 'accent' : 'bad';
function grade(d, ok) {
  if (ok) { d.due = today() + INTERVALS[Math.min(d.box, INTERVALS.length - 1)]; d.box++; }
  else { d.box = 0; d.due = today() + 1; }
}
// A card is new until first graded (then `introduced` = that day). At most NEW_PER_DAY new cards enter per day, oldest first.
const isNew = c => !c.pending && c.introduced == null && DIRS.every(d => c[d].box === 0);
const newRoom = () => Math.max(0, NEW_PER_DAY - cards.filter(c => c.introduced === today()).length);
const newWaiting = () => Math.max(0, cards.filter(isNew).length - newRoom());
const newCards = () => cards.filter(isNew).sort((a, b) => a.id < b.id ? -1 : 1); // oldest first = order they enter
// Day a card enters review under the daily limit (assumes each day's limit gets used up).
function entryDay(c) {
  const i = newCards().indexOf(c), room = newRoom();
  return i < room ? today() : today() + Math.floor((i - room) / NEW_PER_DAY) + 1; // not new (i = -1) → today
}
function queue() {
  const fresh = new Set(newCards().slice(0, newRoom()));
  const a = cards.filter(c => !c.pending && (!isNew(c) || fresh.has(c)))
    .flatMap(c => DIRS.filter(d => c[d].due <= today()).map(dir => ({ c, dir })));
  for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

  back: '<path d="m15 18-6-6 6-6"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ear: '<path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"/><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"/>',
  speaker: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

// The three review directions are the three Athens metro lines; boxes 0…6 are their stations (depot, then 1·3·7·14·30·60 days).
const LINES = {
  gr2ru: { name: 'Узнать', mark: 'Ε' },
  ru2gr: { name: 'Написать', mark: 'Р' },
  listen: { name: 'Услышать', mark: icon('ear') }
};
const badge = d => `<span class="badge l-${d}" aria-hidden="true">${LINES[d].mark}</span>`;
const STATIONS = INTERVALS.length + 1;
const pos = i => (i / (STATIONS - 1) * 100).toFixed(1) + '%';
const stationTrack = (d, cls) => `<div class="track l-${d}">${Array.from({ length: STATIONS }, (_, i) =>
  `<b class="${cls(i)}" style="left:${pos(i)}"></b>`).join('')}</div>`;
// home: a station is lit when any word currently sits there on this line
// day labels for stations 0…6, aligned with the tracks above them (depot shown as a dot)
const stationLabel = i => i ? String(INTERVALS[i - 1]) : '·';
const scale = (cls = '') => `<div class="scale ${cls}" aria-hidden="true"><span></span><div class="days">${Array.from({ length: STATIONS }, (_, i) =>
  `<span style="left:${pos(i)}">${stationLabel(i)}</span>`).join('')}</div><span></span></div>`;
const lineTrack = d => { const at = new Set(cards.filter(c => !c.pending).map(c => Math.min(c[d].box, INTERVALS.length))); return stationTrack(d, i => at.has(i) ? 'on' : ''); };
// one word on one line: passed stations lit, the current one ringed
const wordTrack = (c, d) => { const b = Math.min(c[d].box, INTERVALS.length); return stationTrack(d, i => (i < b ? 'on' : '') + (i === b ? ' here' : '')); };

function streakChip() {
  const n = streakNow(), doneToday = stats.last === today();
  return `<span class="streak${n ? ' on' : ''}${doneToday ? ' done' : ''}" title="Лучшая серия: ${stats.best ?? 0}">${icon('flame')}${n ? plural(n, 'день', 'дня', 'дней') : 'начни серию'}</span>`;
}
let total = 0; // cards in the current review session, for the progress line
const plural = (n, one, few, many) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? one
  : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? few : many);
const avatar = u => u?.photoURL
  ? `<img class="av" src="${esc(u.photoURL)}" alt="" referrerpolicy="no-referrer">`
  : `<span class="av" aria-hidden="true">${esc((u?.displayName || u?.email || '?')[0].toUpperCase())}</span>`;
const back = (id = 'x', label = 'Назад', ic = 'back') => `<button class="icon" id="${id}" aria-label="${label}">${icon(ic)}</button>`;

function home(msg = '') {
  const qq = queue(), due = qq.length, waiting = newWaiting(), pend = cards.filter(c => c.pending).length;
  const per = d => qq.filter(x => x.dir === d).length;
  const n = streakNow(), doneToday = stats.last === today(), u = auth.currentUser;
  app.innerHTML = `
    <section class="block head"><h1>Λέξεις</h1>
      <div class="meta"><a href="#" id="lst2">${plural(cards.length, 'слово', 'слова', 'слов')}</a>${streakChip()}${n && !doneToday ? '<span>повтори сегодня</span>' : ''}</div></section>
    <section class="block today">
      <div class="count">${due}</div>
      <div class="small mut">${due ? `${plural(due, 'карточка', 'карточки', 'карточек').replace(/^\d+ /, '')} на сегодня · около ${Math.max(1, Math.round(due / 3))} мин` : 'всё повторено'}${waiting ? ` · ещё ${waiting} новых ждут` : ''}</div>
      <div class="lines">${DIRS.map(d => `<div class="line">${badge(d)}<div><div class="name">${LINES[d].name}</div>${lineTrack(d)}</div>
        <div class="n${per(d) ? '' : ' zero'}">${per(d)}</div></div>`).join('')}${scale()}</div>

    </section>

      <button aria-label="Добавить">${icon('plus')}</button></form>
    <div class="msg">${esc(msg)}${pend ? `<div>${icon('clock')}Ждут интернета: ${pend} — доделаем сами</div>` : ''}</div>
    <nav class="block menu">
      <button class="mi" id="lst">Словарь<span class="v num">${cards.length}${icon('chev')}</span></button>
      <button class="mi" id="rem">Напоминания<span class="v">${push.token ? push.hour + ':00' : 'выкл'}${icon('chev')}</span></button>
      <button class="mi" id="more">Ещё<span class="v">${icon('chev')}</span></button>
      <div class="acct">${avatar(u)}<div class="who">${esc(u?.displayName || 'Аккаунт')}<small>${esc(u?.email)}</small></div>
        <button class="link" id="out">Выйти</button></div>
    </nav>`;
  $('#rev').onclick = () => { q = queue(); total = q.length; trainAt = 0; next(); };
  $('#add').onsubmit = e => { e.preventDefault(); const w = $('#w').value.trim(); if (w && key()) add(w); };
  $('#w').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#add').requestSubmit(); } };
  $('#w').oninput = e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; };
  $('#lst').onclick = $('#lst2').onclick = e => { e.preventDefault(); list(); };
  $('#rem').onclick = () => setupReminders();
  $('#more').onclick = () => more();
  $('#out').onclick = () => {
    if (!confirm('Выйти из аккаунта?')) return;
    // keys came from this account: don't leave them for whoever signs in next
    localStorage.removeItem('key'); localStorage.removeItem('tts');
    cards = []; stats = {}; push = {};
    signOut(auth); // onAuthStateChanged then shows the login screen
  };
}

// Colour theme is a per-device preference; light/dark still follows the system (Ночь is always dark).
const THEMES = [['graphite', 'Графит', '#ECEEF1', '#1C1F24'], ['aegean', 'Эгейский', '#D9E5F2', '#0E4C92'],
  ['olive', 'Олива', '#E2E6DC', '#3D5A2C'], ['night', 'Ночь', '#0F1217', '#F2C230']];
const syncThemeColor = () => { $('meta[name=theme-color]').content = getComputedStyle(document.body).backgroundColor; };
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', syncThemeColor);
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
  syncThemeColor();
}
// «Как это работает»: every rule on one screen, drawn with the real lines and stations. Keep in sync with the logic above.

    ${part('Три линии', `<p>Каждое слово едет по трём линиям, как в афинском метро. У каждой линии своё расписание.</p>

    ${part('Станции', `<p>Слово стартует из депо. Каждый верный ответ — станция дальше: следующий показ через столько дней.</p>
      <div style="margin-top:14px">${sample('gr2ru')}<div class="stn num">${['депо', ...INTERVALS].map((t, i) => `<span style="left:${pos(i)}">${t}</span>`).join('')}</div></div>
      <p>Дальше — каждые ${INTERVALS.at(-1)} дней. Ошибка возвращает слово на этой линии в депо: снова завтра,
      а сегодня покажем его ещё раз в конце поездки. Повторный показ расписание не двигает.</p>`)}
    ${part('Новые слова', `<p>В день начинаем не больше ${NEW_PER_DAY} новых слов, в порядке добавления. Остальные ждут очереди —
      в карточке видно, когда слово выйдет на линию.</p>`)}
    ${part('Как мы проверяем', `<ul><li>Регистр не важен, ς и σ — одно и то же.</li><li>Артикль можно не писать.</li>
      <li>Ударение пропущено или не там — засчитаем со штампом «Ударение».</li>
      <li>Опечатка или синоним — жми «Засчитать».</li></ul>`)}
    ${part('Главный экран', `<p>Сверху — сколько карточек на сегодня. Ниже три линии: сколько карточек ждёт на каждой,
      а горящие станции — где сейчас твои слова. «Поехали» — начать.</p>`)}
    ${part('Словарь', `<p>Нажми на слово — увидишь, где оно на каждой линии и когда следующий показ.
      «Изменить» — поправить текст; если меняешь греческое слово или пример, мы перезапишем озвучку. Там же — удалить карточку.</p>`)}
    ${part('Серия', `<p>День засчитывается, если ответил хотя бы на одну карточку. Пропустишь целый день — серия начнётся заново.</p>`)}
    ${part('Напоминания', `<p>«Напоминания» → выбери час. Пришлём уведомление в этот час, только если ты сегодня ещё не повторял и есть что повторять.</p>
      <p>Работает в приложении с экрана «Домой» на iPhone (iOS 16.4+) и приходит на устройство, где напоминания включили последними.</p>`)}
    ${part('Ещё', `<ul><li>Тема: Графит, Эгейский, Олива или Ночь. Светлая или тёмная — как на телефоне, «Ночь» всегда тёмная. Запоминается на каждом устройстве отдельно.</li>
      <li>Ключи API — Gemini делает карточки, Google Text-to-Speech озвучивает (без него говорит голос iOS). Если твой аккаунт в списке доступа, ключи владельца подтянутся сами.</li>
      <li>Экспорт — словарь в файл, импорт — обратно из файла.</li><li>«Выйти» — внизу главного экрана.</li></ul>`)}
  </div>`;
  $('#x').onclick = () => more();
}

    <section class="block"><h2>Тема</h2>

const sayBtn = (id = 'say', cls = '', label = 'Произнести') => `<button type="button" class="say ${cls}" id="${id}" aria-label="${label}">${icon('speaker')}</button>`;
const SAY = sayBtn();
// One card layout everywhere (preview, review answer, dictionary): same scale, same axis.
const cardHtml = (c, top = '') => `<article class="block card${top.includes('stamp') ? ' stamped' : ''}">${top}
  <div class="emoji">${esc(c.emoji)}</div>
  <div class="word" lang="el">${esc(c.gr)}${SAY}</div>
  <div class="tr">${esc(c.tr)}</div>
  ${c.forms ? `<div class="forms"><span lang="el">${esc(c.forms)}</span>${formsText(c) ? sayBtn('sayForms', 'sm', 'Произнести формы') : ''}</div>` : ''}
  <div class="ru">${esc(c.ru)}</div>
  ${c.ex ? `<div class="ex"><div class="t" lang="el">${esc(c.ex)}<small lang="ru">${esc(c.exRu)}</small></div>${sayBtn('sayEx', 'sm', 'Произнести пример')}</div>` : ''}</article>`;
const wire = c => {
  if ($('#say')) $('#say').onclick = () => say(c);
  if ($('#sayEx')) $('#sayEx').onclick = () => sayPart(c, 'exAudio', c.ex);
  if ($('#sayForms')) $('#sayForms').onclick = () => sayPart(c, 'formsAudio', formsText(c));
};

// dictionary row: three short bars, one per line, filled by how far the word has travelled
// dictionary row: the station the word is at on each line, as the day number in the line's colour
const level = c => c.pending ? '' : `<span class="stops">${DIRS.map(d => { const b = Math.min(c[d].box, INTERVALS.length);
  return `<i class="l-${d}" aria-label="${LINES[d].name}: ${b ? 'станция ' + INTERVALS[b - 1] : 'старт'}">${stationLabel(b)}</i>`; }).join('')}</span>`;

// Forgiving dictionary search. plain(): case, accents, ς, article and punctuation don't matter.
// phon(): one loose Latin sound key shared by Greek, Cyrillic transcription and Latin, so «таласса», «thalasa» and «θάλασσα» collide.
// relayout(): the query as if typed with another of the three keyboard layouts active (same key positions).
const KB = ["qwertyuiop[]asdfghjkl;'zxcvbnm,.", 'йцукенгшщзхъфывапролджэячсмитьбю', ";ςερτυθιοπ[]ασδφγηξκλ΄'ζχψωβνμ,."];
const relayout = q => KB.flatMap((a, i) => KB.filter((_, j) => j !== i).map(b => [...q].map(ch => a.includes(ch) ? b[a.indexOf(ch)] : ch).join('')));
const plain = s => (s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/ς/g, 'σ').trim()
  .replace(/^(ο\/η|η\/ο|οι|ο|η|το|τα|о\/и|и\/о|о|и|то|та)\s+/, '').replace(/[-‐'’]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const LAT = { ξ: 'ks', ψ: 'ps', ц: 'ts', ч: 'ts', ш: 's', щ: 's', ю: 'iu', я: 'ia' };
[['αβγδεζηθικλμνοπρστυφχω', 'avgdezitiklmnoprstifho'], ['абвгдежзийклмнопрстуфхыэ', 'abvgdezziiklmnoprstufhie']]
  .forEach(([a, b]) => [...a].forEach((c, i) => LAT[c] = b[i]));
const SOUND = [[/[kc]h/g, 'h'], [/th/g, 't'], [/dh/g, 'd'], [/ph/g, 'f'], [/x/g, 'ks'], [/[cq]/g, 'k'], [/w/g, 'o'], [/[yj]/g, 'i'],
  [/([ae])u/g, '$1v'], [/ou|oo/g, 'u'], [/ee/g, 'i'], [/ai/g, 'e'], [/[eo]i/g, 'i'], [/([ae])v/g, '$1f'],
  [/m[pb]/g, 'b'], [/n[td]/g, 'd'], [/ng|gk/g, 'g'], [/tz/g, 'dz'], [/(.)\1+/g, '$1']];
const phon = (p, front) => SOUND.reduce((s, [re, to]) => s.replace(re, to), [...p.replace(/ου/g, 'u').replace(/([αεη])υ/g, '$1β')
  .replace(/γ(?=[εηιυ]|αι|ει|οι)/g, front ? 'y' : 'γ')].map(c => LAT[c] ?? c).join('').replace(/[^a-z0-9]/g, ''));
const searchKeys = c => {
  const g = plain(c.gr || c.text), t = plain(c.tr);
  return { p: [g, plain(c.ru), t].join('|'), f: [...new Set([phon(g), phon(g, true), phon(t)])].join('|') };
};
// approximate substring (Sellers): q occurs somewhere in k with at most one typo
const near = (q, k) => {
  let p = [...Array(q.length + 1).keys()];
  for (const ch of k) {
    const n = [0];
    for (let i = 1; i <= q.length; i++) n[i] = Math.min(p[i] + 1, n[i - 1] + 1, p[i - 1] + (q[i - 1] !== ch));
    if (n[q.length] <= 1) return true;
    p = n;
  }
  return false;
};
// one-letter queries match plainly; longer ones also via layouts and sound, 6+ letters forgive one typo
const matcher = raw => {
  const q = raw.trim().toLowerCase();
  if (!q) return () => true;
  const vs = q.length < 2 ? [plain(q)] : [...new Set([q, ...relayout(q)].map(plain))].filter((v, i) => !i || v.length > 1);
  const ps = q.length < 2 ? [] : [...new Set(vs.map(v => phon(v)))].filter(Boolean);
  const fz = ps[0]?.length >= 6 ? ps[0] : '';
  return k => vs.some(v => k.p.includes(v)) || ps.some(f => k.f.includes(f)) || !!fz && near(fz, k.f);
};

function list() {
  const sortKey = c => (c.gr || c.text).replace(/^(ο|η|το|οι|τα)\s+/, '');
  const rows = [...cards].sort((a, b) => sortKey(a).localeCompare(sortKey(b), "el"));
  app.innerHTML = `<div class="top">${back()}<h2>Словарь</h2><span class="small mut num">${cards.length}</span></div>
    <input id="s" type="search" placeholder="Поиск по-гречески или по-русски" aria-label="Поиск" autocomplete="off">
    <div class="block list" style="margin-top:12px">${!rows.length ? '<p class="mut center" style="padding:24px 12px">Пока пусто — добавь первое слово на главной</p>' : rows.map(c => { const k = searchKeys(c); return `<button class="item" data-id="${esc(c.id)}" data-p="${esc(k.p)}" data-f="${esc(k.f)}">
      <span class="e">${c.pending ? icon('clock') : esc(c.emoji)}</span>
      <span class="t"><b lang="el">${esc(c.gr || c.text)}</b><small>${esc(c.pending ? 'ждёт интернета' : c.ru)}</small></span>
      ${level(c)}</button>`; }).join('') + '<p class="mut center" id="none" hidden style="padding:24px 12px">Ничего не нашли</p>'}</div>`;
  $('#x').onclick = () => home();
  $('#s').oninput = e => { // filter in place so the keyboard stays open
    const m = matcher(e.target.value);
    let any = false;
    document.querySelectorAll('.item').forEach(el => { el.hidden = !m(el.dataset); any ||= !el.hidden; });
    if ($('#none')) $('#none').hidden = any;
  };
  document.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const c = cards.find(c => c.id === el.dataset.id);
    if (!c.pending) return view(c);
    if (!confirm(`«${c.text}» ещё не готово. Убрать из очереди?`)) return;
    cards = cards.filter(x => x !== c);
    remove(c.id);
    list();
  });
}

// Read-only card from the dictionary: where the word is on each line and when it comes up next; editing is one tap away.
function view(c) {
  const start = entryDay(c); // a waiting new card shows nothing before it enters review
  const when = d => { const n = Math.max(c[d].due, start) - today(); return n <= 0 ? 'сегодня' : n === 1 ? 'завтра' : 'через ' + plural(n, 'день', 'дня', 'дней'); };
  app.innerHTML = `<div class="top">${back()}<h2>Карточка</h2><button class="link" id="ed">Изменить</button></div>` + cardHtml(c) +
    `<section class="block sched">${DIRS.map(d => `<div class="st">${badge(d)}<div><div class="name">${LINES[d].name}</div>${wordTrack(c, d)}</div>
      <div class="when">${when(d)}</div></div>`).join('')}${scale('st-scale')}
      ${start > today() ? `<p class="small mut" style="margin:0 0 14px">Новое слово ждёт очереди: в день начинаем не больше ${NEW_PER_DAY} новых</p>` : ''}</section>`;
  wire(c);
  $('#x').onclick = () => list();
  $('#ed').onclick = () => edit(c);
}

function edit(c) {
  const F = [['gr', 'Греческий'], ['tr', 'Транскрипция'], ['forms', 'Грамматика'], ['ru', 'Перевод'], ['ex', 'Пример'],
    ['exRu', 'Перевод примера'], ['emoji', 'Эмодзи']];
  app.innerHTML = `<div class="top">${back()}<h2>Редактирование</h2>${SAY}</div>
    <form id="ef" class="block form">${F.map(([k, l]) => `<label>${l}<input name="${k}" value="${esc(c[k])}" autocomplete="off"></label>`).join('')}
      <button id="sv">Сохранить</button></form>
    <button class="bad" id="del" style="margin-top:12px">Удалить карточку</button>`;
  $('#x').onclick = () => view(c);
  $('#say').onclick = () => say(c);
  $('#ef').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target)), newGr = d.gr.trim() !== c.gr, newEx = d.ex !== c.ex;
    if (!d.gr.trim()) return alert('Греческое слово не может быть пустым');
    if (d.forms !== c.forms) delete c.formsAudio; // re-recorded on next play
    Object.assign(c, d, { gr: d.gr.trim() });
    if (newGr || newEx) { // old audio says the old text
      $('#sv').disabled = true; $('#sv').textContent = 'Озвучиваем…';
      if (newGr) try { c.audio = await tts(c.gr); } catch { delete c.audio; }
      if (newEx) try { c.exAudio = await tts(c.ex); } catch { delete c.exAudio; }
    }
    save(c);
    view(c);
  };
  $('#del').onclick = () => {
    if (!confirm(`Удалить «${c.gr}»?`)) return;
    cards = cards.filter(x => x !== c);
    remove(c.id);
    list();
  };
}

// same flip card as the splash: what you typed on the front, "?" on the back, live step text below
const making = text => `<div class="splash"><div class="flip">
    <div class="face${text.length > 9 ? ' long' : ''}">${esc(text)}</div><div class="face back q">?</div></div>
  <h1 style="font-size:17px">Готовим карточку</h1><div id="step"></div></div>`;

async function add(raw) {
  const words = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
  const park = list => list.forEach(w => { const d = draft(w); cards.push(d); save(d); });
  if (words.length > 1) { // batch: no preview, fill in the background
    park(words);
    home(`Готовим ${plural(words.length, 'карточку', 'карточки', 'карточек')}…`);
    return processPending();
  }
  const text = words[0];
  app.innerHTML = making(text);
  try {
    const { c, note } = await build(text, s => { if ($('#step')) $('#step').textContent = s; });
    app.innerHTML = `<div class="top">${back('no', 'Отмена')}<h2>Новая карточка</h2></div>` + cardHtml(c) +
      `<p class="small mut center">${esc(note)}</p><button id="yes">Сохранить в словарь</button>`;
    wire(c);
    say(c);
    $('#no').onclick = () => home();
    $('#yes').onclick = () => {
      Object.assign(c, { id: newId(), ...schedule() });
      save(c);
      cards.push(c);
      home('Добавлено: ' + c.gr);
    };
  } catch (e) {
    if (e.status) return home('Ошибка: ' + e.message);
    park([text]); // no network: keep the word, finish it later
    home(`Нет связи — «${text}» доделаем, когда появится интернет`);
  }
}

// Review progress is a ride along the current card's line; the train glides from where the last card left it.
let trainAt = 0;
const topBar = d => `<div class="top l-${d}">${back('x', 'Закончить', 'x')}
  <span class="dir">${badge(d)}${LINES[d].name}</span>
  <div class="track"><i class="fill" style="width:${trainAt}%"></i><i class="train" style="left:${trainAt}%"></i></div>
  <span class="small mut num">${total - q.length}/${total}</span></div>`;
function ride() { // called after q.shift(): the card on screen counts as not yet done
  const p = (total - q.length - 1) / total * 100;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if ($('.top .fill')) { $('.top .fill').style.width = p + '%'; $('.top .train').style.left = p + '%'; }
    trainAt = p;
  }));
}

function next() {
  const it = q.shift();
  if (!it) return home('Готово на сегодня. До завтра!');
  const { c, dir } = it;
  const answer = `<form id="f" class="answer" style="margin-top:12px"><input id="a" lang="el" autocomplete="off" autocorrect="off" autocapitalize="off"
    spellcheck="false" placeholder="По-гречески" aria-label="Ответ по-гречески"><button style="margin-top:12px">Проверить</button></form>`;
  if (dir === 'gr2ru') {
    app.innerHTML = topBar(dir) + `<article class="block card front"><div class="word" lang="el">${esc(c.gr)}${SAY}</div></article>
      <button id="show" style="margin-top:12px">Показать перевод</button>`;
    $('#show').onclick = () => back_(it, null);
  } else if (dir === 'ru2gr') {
    app.innerHTML = topBar(dir) + `<article class="block card front"><div class="emoji">${esc(c.emoji)}</div><div class="word">${esc(c.ru)}</div></article>` + answer;
  } else { // listen: audio only, type what you hear
    app.innerHTML = topBar(dir) + `<article class="block card front">${sayBtn('say', 'big', 'Послушать ещё раз')}
      <div class="prompt">Нажми, чтобы послушать ещё раз</div></article>` + answer;
  }
  wire(c);
  ride();
  if (dir !== 'ru2gr') say(c);
  if ($('#f')) { $('#a').focus(); $('#f').onsubmit = e => { e.preventDefault(); back_(it, $('#a').value); }; }
  $('#x').onclick = () => home();
}

function back_(it, answer) {
  const c = it.c;
  let top = '', buttons = '<button class="bad" id="n">Не знал</button><button class="ok" id="y">Знал</button>';
  if (answer !== null) {
    const r = check(answer, c.gr);
    // the verdict stamps onto the card and stays, like a validated ticket
    top = `<span class="stamp ${r === 'accent' ? 'warn' : r}">${r === 'ok' ? 'Верно' : r === 'accent' ? 'Ударение' : 'Ошибка'}</span>`
      + (r === 'ok' ? '' : `<div class="yours">Ты написал: «<span lang="el">${esc(answer)}</span>»</div>`);
    buttons = r === 'bad' ? '<button class="sec" id="y">Засчитать</button><button id="n">Дальше</button>'
      : '<button id="y">Дальше</button>';
    say(c);
  }
  app.innerHTML = topBar(it.dir) + cardHtml(c, top) + `<div class="row">${buttons}</div>
    <p class="center" style="margin:32px 0 0"><button class="link" id="del" style="font-size:13px;font-weight:400;color:var(--mut)">Удалить карточку</button></p>`;
  ride();
  $('#x').onclick = () => home();
  wire(c);
  $('#y').onclick = () => done(it, true);
  if ($('#n')) $('#n').onclick = () => done(it, false);
  $('#del').onclick = () => {
    if (!confirm(`Удалить «${c.gr}»?`)) return;
    cards = cards.filter(x => x !== c);
    q = q.filter(x => x.c !== c);
    remove(c.id);
    next();
  };
}

function done(it, ok) {
  if (!it.retry) { // re-shows within a session don't move the schedule
    grade(it.c[it.dir], ok);
    bumpStreak();
    it.c.introduced ??= today(); // counts toward today's NEW_PER_DAY
    save(it.c);
  }
  if (!ok) { q.push({ ...it, retry: true }); total++; }
  next();
}

async function exportAll() {
  const file = new File([JSON.stringify(cards)], `greek-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) return navigator.share({ files: [file] }).catch(() => {});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  a.click();
}
async function importAll(file) {
  try {
    const list = JSON.parse(await file.text());
    if (!Array.isArray(list) || !list.every(c => c.id && c.gr && c.gr2ru && c.ru2gr)) throw new Error('не тот файл');
    list.forEach(save);
    cards = await loadAll();
    home('Импортировано: ' + list.length);
  } catch (e) { home('Ошибка импорта: ' + e.message); }
}

function selftest() {
  const eq = (a, b) => { if (a !== b) throw new Error(a + ' !== ' + b); };
  eq(check('καλημέρα', 'η καλημέρα'), 'ok');
  eq(check(' Καλημερα ', 'η καλημέρα'), 'accent');
  eq(check('καλησπέρα', 'η καλημέρα'), 'bad');
  eq(check('ο δρόμοσ', 'ο δρόμος'), 'ok');
  const d = { box: 0, due: 0 };
  grade(d, true); eq(d.due, today() + 1);
  grade(d, true); eq(d.due, today() + 3);
  grade(d, false); eq(d.box, 0); eq(d.due, today() + 1);
  const real = cards; // new-per-day limit: 12 fresh cards, only gr2ru is due today
  cards = Array.from({ length: 12 }, (_, i) => ({ id: 'a' + String(i).padStart(2, '0'), ...schedule() }));
  eq(queue().length, NEW_PER_DAY); eq(newWaiting(), 2);
  cards[0].introduced = today(); // one seen today: still 10 today in total, one less waiting
  eq(queue().length, NEW_PER_DAY); eq(newWaiting(), 2); eq(newRoom(), NEW_PER_DAY - 1);
  cards.push(draft('x')); eq(queue().length, NEW_PER_DAY); // drafts never enter review
  eq(entryDay(cards[0]), today()); eq(entryDay(cards[1]), today()); // introduced / within today's room
  eq(entryDay(cards[11]), today() + 1); // 11th new card with room 9 → tomorrow
  cards = real;
  eq(nextStats({}, 10).streak, 1); // streak: first day, next day, same day, gap
  const s9 = { last: 9, streak: 4, best: 4 };
  eq(nextStats(s9, 10).streak, 5); eq(nextStats(s9, 10).best, 5); eq(nextStats(s9, 9), s9);
  eq(nextStats({ last: 7, streak: 4, best: 6 }, 10).streak, 1); eq(nextStats({ last: 7, streak: 4, best: 6 }, 10).best, 6);
  const finds = (q, c) => matcher(q)(searchKeys(c)); // forgiving dictionary search
  const sea = { gr: 'η θάλασσα', ru: 'море', tr: 'и ТХА-ла-са' }, morning = { gr: 'η καλημέρα', ru: 'доброе утро', tr: 'ка-ли-МЭ-ра' };
  const thanks = { gr: 'ευχαριστώ', ru: 'спасибо', tr: 'эф-ха-ри-СТО' }, oven = { gr: 'ο φούρνος', ru: 'пекарня, печь', tr: 'о ФУР-нос' };
  for (const q of ['таласса', 'тхалас', 'thalassa', 'thalasa', 'θαλασσα', 'ΘΑΛΑΣΣΑ', 'θαλ', 'η θαλασσα', 'море', 'МОРЕ', 'vjht', 'ωξητ', 'ualassa', 'гфдфыыф'])
    eq(finds(q, sea), true);
  for (const q of ['калимера', 'калимэра', 'kalimera', 'KALIMERA', 'kalhmera', 'καλημερα', 'rfkbvthf']) eq(finds(q, morning), true);
  for (const q of ['efharisto', 'eucharisto', 'evcharisto', 'эфхаристо', 'ευχαριστω']) eq(finds(q, thanks), true);
  for (const q of ['fournos', 'furnos', 'фурнос', 'пекарн', 'пекарня печь']) eq(finds(q, oven), true);
  eq(finds('spiti', { gr: 'το σπίτι', ru: 'дом' }), true); eq(finds('yia', { gr: 'γεια', ru: 'привет' }), true);
  eq(finds('салата', { pending: true, text: 'σαλάτα' }), true);
  for (const q of ['vfkfccf', 'telefono', 'kipos', 'спасибо']) eq(finds(q, sea), false);
  return 'selftest ok';
}

function login(msg = '') {
  app.innerHTML = `<div class="login"><div class="dots">${DIRS.map(badge).join('')}</div><h1>Λέξεις</h1>
    <p>Греческие слова на каждый день</p><button id="in">Войти через Google</button><p class="small">${esc(msg)}</p></div>`;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' }); // let a different account sign in after logout
  $('#in').onclick = () => signInWithPopup(auth, provider).catch(e => login('Ошибка входа: ' + e.message));
}

navigator.serviceWorker?.register('sw.js').catch(() => {});
const SPLASH = app.innerHTML; // reused while a fresh sign-in loads the dictionary
syncThemeColor();
onAuthStateChanged(auth, async user => {
  if (!user) return login();
  app.innerHTML = SPLASH;
  try {
    await Promise.all([loadKeys(), loadMeta()]);
    const moved = await migrate();
    cards = await loadAll();
    processPending(); // background: finish words added offline
    home(location.hash === '#test' ? selftest() : moved ? `Перенесено с телефона в аккаунт: ${moved}` : '');
  } catch (e) { home('Ошибка загрузки: ' + e.message); }
});
